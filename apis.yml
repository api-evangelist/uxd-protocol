aid: uxd-protocol
name: UXD Protocol
description: 'UXD Protocol is a decentralized stablecoin protocol built on Solana,
  operated by Soteria FZCO, whose UXD token is backed 100% by an Asset Liability
  Management Module that deploys collateral into delta-neutral positions, on-chain
  lending, and real-world assets. The protocol is governed by the UXP token, is
  documented on GitBook, publishes six third-party security audits and a self-run
  bug bounty, and ships an open-source Solana program with a TypeScript client on
  npm and a Rust CPI client on crates.io. Backed by Multicoin Capital.'
